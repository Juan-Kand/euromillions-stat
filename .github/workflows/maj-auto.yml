name: Mise à jour automatique EuroMillions STAT
on:
  schedule:
    - cron: '30 22 * * 2,5'   # mardi/vendredi 22h30 UTC (23h30 Paris), après le tirage
    - cron: '0 6 * * 3,6'     # rattrapage le lendemain matin
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Récupérer les nouveaux tirages
        run: node scripts/maj.js 2>&1 | tee maj.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Valider
        run: node scripts/verifier.js
      - name: Commit et push
        run: |
          if ! git diff --quiet index.html; then
            git config user.name "euromillions-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -am "Tirage automatique $(date -u +%d/%m/%Y)"
            git push
            gh api -X POST repos/${{ github.repository }}/pages/builds || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Alerte si échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const t='⚠️ EuroMillions STAT : mise à jour automatique en échec';
            const o=await github.rest.issues.listForRepo({...context.repo,state:'open'});
            if(!o.data.some(i=>i.title===t))await github.rest.issues.create({...context.repo,title:t,body:'Voir le journal : '+context.serverUrl+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId});
